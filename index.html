function u(b){return Uint8Array.from(atob(b),function(x){return x.charCodeAt(0)})}
async function open_(pw){
  var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
  var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c));
  var html=new TextDecoder().decode(buf);
  document.open();document.write(html);document.close();
}
function g(){try{return localStorage.getItem('kk-gate')}catch(e){return null}}
function s(v){try{v?localStorage.setItem('kk-gate',v):localStorage.removeItem('kk-gate')}catch(e){}}

});

},true);
